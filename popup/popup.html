<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BE Locale Switcher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="../icons/icon-32.png" alt="BE Locale Switcher" class="brand-icon">
        <div class="brand-text">
          <h1 class="brand-title">BE Locale Switcher</h1>
          <span id="brand-subtitle" class="brand-subtitle">Belgian Locale Enforcer</span>
        </div>
      </div>
      <!-- Global Toggle Switch -->
      <label class="switch" title="Toggle extension on or off">
        <input type="checkbox" id="global-toggle" checked>
        <span class="slider"></span>
      </label>
    </header>

    <!-- Language Direction Selector -->
    <div class="lang-selector-card">
      <span class="lang-selector-label">Language Preference</span>
      <div class="segmented-control" role="group" aria-label="Target language preference">
        <button id="lang-btn-fr" class="segmented-btn active" data-lang="fr" type="button">
          <span class="flag-icon">🇫🇷</span> French First
        </button>
        <button id="lang-btn-nl" class="segmented-btn" data-lang="nl" type="button">
          <span class="flag-icon">🇳🇱</span> Dutch First
        </button>
      </div>
    </div>

    <!-- Active Site Card -->
    <section class="card site-card">
      <div class="site-header">
        <span class="site-label">Active Site</span>
        <span id="site-domain" class="site-domain">Loading...</span>
      </div>

      <div class="status-indicator">
        <div id="status-dot" class="status-dot dot-idle"></div>
        <div class="status-details">
          <span id="status-title" class="status-title">Checking site...</span>
          <span id="status-desc" class="status-desc">Analyzing locale settings</span>
        </div>
      </div>

      <!-- Action Button for Current Site -->
      <div class="site-actions">
        <button id="site-action-btn" class="btn btn-secondary" disabled>
          <span id="site-action-icon" class="btn-icon">⚡</span>
          <span id="site-action-text">Loading...</span>
        </button>
        <p id="site-error" class="domain-error hidden" role="alert"></p>
      </div>
    </section>

    <!-- Injected Custom Domains Accordion -->
    <section class="domain-section">
      <button id="custom-accordion-btn" class="accordion-header">
        <span id="custom-count-label">Injected Custom Domains (0)</span>
        <span id="custom-accordion-arrow" class="accordion-arrow">▾</span>
      </button>

      <div id="custom-accordion-content" class="accordion-content hidden">
        <div class="add-domain-row">
          <input type="text" id="custom-domain-input" placeholder="e.g. aliexpress.com" autocomplete="off" spellcheck="false">
          <button id="add-domain-btn" class="btn btn-sm btn-primary">Add</button>
        </div>
        <p id="custom-domain-error" class="domain-error hidden" role="alert"></p>
        <ul id="custom-domain-items" class="domain-items-list">
          <li class="domain-empty">No custom domains added yet.</li>
        </ul>
      </div>
    </section>

    <!-- Excluded .BE Domains (Only visible when user excluded a .be site) -->
    <section id="excluded-section" class="domain-section hidden">
      <button id="excluded-accordion-btn" class="accordion-header">
        <span id="excluded-count-label">Excluded .BE Sites (0)</span>
        <span id="excluded-accordion-arrow" class="accordion-arrow">▾</span>
      </button>

      <div id="excluded-accordion-content" class="accordion-content hidden">
        <ul id="excluded-domain-items" class="domain-items-list">
          <li class="domain-empty">No .be sites excluded.</li>
        </ul>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <span id="footer-badge" class="footer-badge">fr-FR &bull; .BE</span>
      <span class="footer-privacy">Zero-bloat &bull; DNR Headers</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
