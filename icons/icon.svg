<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Card Drop Shadows -->
    <filter id="beDropShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#080e18" flood-opacity="0.6"/>
    </filter>
    <filter id="subDropShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#080e18" flood-opacity="0.4"/>
    </filter>

    <!-- Clip Paths for Cards -->
    <clipPath id="clipBelgian">
      <rect x="28" y="26" width="71" height="58" rx="14" ry="14"/>
    </clipPath>
    <clipPath id="clipFrench">
      <rect x="13" y="65" width="39" height="36" rx="9" ry="9"/>
    </clipPath>
    <clipPath id="clipDutch">
      <rect x="73" y="65" width="42" height="36" rx="9" ry="9"/>
    </clipPath>
  </defs>

  <!-- Base Dark Navy Squircle Card -->
  <rect x="2" y="2" width="124" height="124" rx="28" ry="28" fill="#17233a" stroke="#263654" stroke-width="1.5"/>

  <!-- 1. French Flag Card (Bottom Left) -->
  <g filter="url(#subDropShadow)">
    <g clip-path="url(#clipFrench)">
      <rect x="13" y="65" width="13" height="36" fill="#002587"/>
      <rect x="26" y="65" width="13" height="36" fill="#ffffff"/>
      <rect x="39" y="65" width="13" height="36" fill="#b92330"/>
    </g>
    <rect x="13" y="65" width="39" height="36" rx="9" ry="9" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  </g>

  <!-- 2. Dutch Flag Card (Bottom Right) -->
  <g filter="url(#subDropShadow)">
    <g clip-path="url(#clipDutch)">
      <rect x="73" y="65" width="42" height="12" fill="#ee2b36"/>
      <rect x="73" y="77" width="42" height="12" fill="#cad0d9"/>
      <rect x="73" y="89" width="42" height="12" fill="#214584"/>
    </g>
    <rect x="73" y="65" width="42" height="36" rx="9" ry="9" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  </g>

  <!-- 3. Belgian Flag Card (Top Center, Overlapping) -->
  <g filter="url(#beDropShadow)">
    <g clip-path="url(#clipBelgian)">
      <rect x="28" y="26" width="23.67" height="58" fill="#010101"/>
      <rect x="51.67" y="26" width="23.66" height="58" fill="#f6db3e"/>
      <rect x="75.33" y="26" width="23.67" height="58" fill="#ee2b36"/>
    </g>
    <rect x="28" y="26" width="71" height="58" rx="14" ry="14" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  </g>

  <!-- 4. Exchange Arrows (Between FR & NL, directly below BE) -->
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top arrow pointing right -->
    <path d="M 57 90.5 L 69 90.5"/>
    <path d="M 66 87.5 L 69.5 90.5 L 66 93.5"/>

    <!-- Bottom arrow pointing left -->
    <path d="M 70 95.5 L 58 95.5"/>
    <path d="M 61 92.5 L 57.5 95.5 L 61 98.5"/>
  </g>
</svg>