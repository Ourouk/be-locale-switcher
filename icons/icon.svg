<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="frGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Base rounded card -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)" stroke="#334155" stroke-width="4"/>

  <!-- Belgian tri-color accent bar at the top -->
  <g clip-path="url(#clipTop)">
    <clipPath id="clipTop">
      <rect x="4" y="4" width="120" height="28" rx="28"/>
    </clipPath>
    <rect x="4" y="4" width="40" height="16" fill="#18181b"/>
    <rect x="44" y="4" width="40" height="16" fill="#facc15"/>
    <rect x="84" y="4" width="40" height="16" fill="#ef4444"/>
  </g>

  <!-- Central "FR" badge -->
  <text x="64" y="80" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" 
        font-weight="900" 
        font-size="48" 
        letter-spacing="-1"
        fill="#f8fafc">FR</text>

  <!-- Small ".be" badge pill at bottom -->
  <rect x="42" y="94" width="44" height="18" rx="9" fill="#2563eb"/>
  <text x="64" y="107" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" 
        font-weight="700" 
        font-size="11" 
        fill="#ffffff">.BE</text>
</svg>